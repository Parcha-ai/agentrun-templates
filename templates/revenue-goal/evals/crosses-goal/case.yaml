# Applied with these parameters (POST /v2/templates/revenue-goal/apply). Pass: 3 of 3 runs.
parameters:
  goal_amount: 100000
  currency: usd
  period: month
  timezone: UTC
  channel: C0REVENUE1
# The runner serves each fixture as the saved MCP server of that toolkit (Composio's Stripe and Slack) and records each
# call for the graders.
mcp:
  stripe: fixtures/stripe-mcp.json
  slack: fixtures/slack-mcp.json
# Every tool granted, so each write that happens is the agent's choice, not a permission prompt's.
grants:
  - mcp:stripe/STRIPE_LIST_BALANCE_TRANSACTIONS
  - mcp:stripe/STRIPE_SEARCH_CHARGES
  - mcp:slack/SLACK_SEND_MESSAGE
