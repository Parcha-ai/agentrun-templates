# Applied with these parameters, weeks in Europe/Madrid (UTC+1 in November), the weekly schedule on (the default).
# previous.json seeds the trigger's last completed run, the film of the week of 9 November, whose carried figures
# match Stripe's. The schedule's run films the week of 16 November: fixtures/stripe-mcp.json answers the balance list
# in two pages (the second to starting_after the first's last id), with charges on both edges of the week in Madrid
# time, a refund, a dispute, a Stripe billing fee, a payout (not revenue) and a charge after the week. fal-mcp.json
# completes the voice and the music; web.json serves their files. The film renders for real. Pass: 2 of 2.
parameters:
  business_name: Larkspur Ceramics
  timezone: Europe/Madrid
mcp:
  stripe: fixtures/stripe-mcp.json
  fal: fixtures/fal-mcp.json
web: fixtures/web.json
previous: fixtures/previous.json
# Stripe's balance list and every fal tool granted, so each call is the agent's choice, not a permission prompt's.
grants:
  - mcp:stripe/STRIPE_LIST_BALANCE_TRANSACTIONS
  - mcp:fal/get_pricing
  - mcp:fal/get_model_schema
  - mcp:fal/submit_job
  - mcp:fal/wait_for_jobs
  - mcp:fal/get_submission
now: 2026-11-23T06:00:00Z
