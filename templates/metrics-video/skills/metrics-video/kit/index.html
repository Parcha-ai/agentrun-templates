<!doctype html>
<!--
  Weekly metrics film kit: a HyperFrames project, 1920x1080, whose every figure comes from one data module,
  window.MV, which `node metrics.mjs compute` writes into the mv-data block below from Stripe's figures. No scene
  holds a number of its own: each reads MV, so the film says exactly what the script worked out.
  `node metrics.mjs place` writes the scene hosts and the media between the MV-HOSTS and MV-MEDIA markers and the
  root's length: change them with it, not by hand. Scenes sit back to back on lane 1, captions on lane 2, the voice
  and the music on lanes 3 and 4.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script id="mv-data">
      window.MV = null; // KIT-DATA: node metrics.mjs compute writes the week's figures here
    </script>
    <script>
      // mvFilmed: the currencies the film shows, in the script's order. mvSeg: the length of one currency's part of a
      // scene (the scene's seconds as placed, shared evenly). mvTitle: the business name, or null.
      window.mvFilmed = () => window.MV.currencies.filter((c) => c.filmed);
      window.mvSeg = (name) => window.MV.timing[name].seconds / Math.max(1, window.mvFilmed().length);
      // mvMoney: whole currency units as the script writes them (symbol, grouping, a true minus), for a count-up's
      // frames; its last frame is set to the script's own string.
      window.mvMoney = (whole, symbol) => {
        const s = /^[A-Z]{3}$/.test(symbol) ? symbol + " " : symbol;
        return (whole < 0 ? "−" : "") + s + Math.abs(Math.round(whole)).toLocaleString("en-US");
      };
      // mvCount: a count-up on el from 0 to money.whole over 1.4 s at `at` on tl, then held. Its text is a function of
      // the tween's progress alone (HyperFrames seeks each frame on its own), and its last frame is the script's string.
      window.mvCount = (tl, el, money, symbol, at) => {
        const o = { v: 0 };
        el.textContent = window.mvMoney(0, symbol);
        tl.fromTo(o, { v: 0 }, { v: money.whole, duration: 1.4, ease: "power2.out", onUpdate: function () {
          el.textContent = this.progress() >= 1 ? money.display : window.mvMoney(o.v, symbol);
        } }, at);
      };
      // mvBars: bars for values (whole units) in a box h tall, from a zero line; returns each bar's top and height in
      // % of the box, and the zero line's top. Negative values hang below the line.
      window.mvBars = (values) => {
        const hi = Math.max(0, ...values), lo = Math.max(0, ...values.map((v) => -v));
        const span = hi + lo || 1;
        const zero = (hi / span) * 100;
        return { zero, bars: values.map((v) => ({ top: v >= 0 ? zero - (v / span) * 100 : zero, height: (Math.abs(v) / span) * 100, neg: v < 0 })) };
      };
      // rfReady and rfFit as the release film kit has them: load the faces, then fit a line of text to a width.
      window.rfReady = (ids) => Promise.all(ids.map((id) => {
        const cs = getComputedStyle(document.getElementById(id));
        return document.fonts.load(`${cs.fontWeight} 100px ${cs.fontFamily}`).catch(() => {});
      }));
      const rfCtx = document.createElement("canvas").getContext("2d");
      window.rfFit = (el, { w, h = Infinity, max, units, sep = " ", each = false, pad = 0, face = el }) => {
        const cs = getComputedStyle(face);
        const fs = parseFloat(cs.fontSize) || 100;
        const ls = cs.letterSpacing === "normal" ? 0 : parseFloat(cs.letterSpacing) / fs;
        const lh = cs.lineHeight === "normal" ? 1.2 : parseFloat(cs.lineHeight) / fs;
        rfCtx.font = `${cs.fontStyle} ${cs.fontWeight} 100px ${cs.fontFamily}`;
        const cased = (t) => cs.textTransform === "uppercase" ? t.toUpperCase() : t;
        const em = (t) => rfCtx.measureText(cased(t)).width / 100 + ls * t.length;
        const parts = (units || [el.textContent.trim()]).map(em), gap = sep ? em(sep) : 0;
        const lines = (s) => {
          let n = 1, x = 0;
          for (const p of parts) {
            if ((p + pad) * s > w) return Infinity;
            if (x && (each || (x + gap + p + pad) * s > w)) { n++; x = p; } else x += (x ? gap : 0) + p;
          }
          return n;
        };
        const ok = (s) => { const n = lines(s); return n !== Infinity && n * lh * s <= h; };
        let lo = max;
        while (lo > 8 && !ok(lo)) lo -= 1;
        el.style.fontSize = lo + "px";
        return { size: lo, height: lines(lo) * lh * lo };
      };
    </script>
    <style>
      :root {
        /* The palette: one accent, rationed to the figure that matters (this week's bar, the best day, the change). */
        --ground: #ebe8e1;
        --ink: #15151a;
        --muted: #8f8b82;
        --bar: #b9b5ab;
        --rule: #cfcbc2;
        --accent: #ff4f1a;
        --accent-ink: #15151a;
        --font-display: "League Gothic";
        --font-text: "Inter";
        --font-mono: "JetBrains Mono";
        --cap-font: "Inter";
        --cap-ink: #ffffff;
        --cap-bg: rgba(12, 12, 14, 0.86);
        --cap-edge: rgba(255, 255, 255, 0.5);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45" data-width="1920" data-height="1080">
      <!-- MV-HOSTS -->
      <div id="open" data-composition-id="open" data-composition-src="compositions/open.html" data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="revenue" data-composition-id="revenue" data-composition-src="compositions/revenue.html" data-start="5" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="days" data-composition-id="days" data-composition-src="compositions/days.html" data-start="13" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="change" data-composition-id="change" data-composition-src="compositions/change.html" data-start="21" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="refunds" data-composition-id="refunds" data-composition-src="compositions/refunds.html" data-start="29" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="37" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- /MV-HOSTS -->
      <!-- MV-MEDIA -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="45" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080"></div>
      <audio id="voiceover" class="clip" src="assets/voiceover.mp3" data-start="0.5" data-track-index="3" data-volume="1"></audio>
      <audio id="music" class="clip" src="assets/music.mp3" data-start="0" data-duration="45" data-track-index="4" data-volume="0.16" data-fade-in="0.4" data-fade-out="1.5"></audio>
      <!-- /MV-MEDIA -->
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
