<!-- Refunds and disputes: one currency at a time, and inside it one figure at a time: the refunds (their amount counting
     up, their count under it), then the disputes the same way, then the money won back from disputes (a dispute opened
     in an earlier week can be won this one, with no new dispute). A currency with none of them says so in words. Each
     figure is on screen at least the plan's item_seconds (its count and the time to read it): a currency whose figures
     can't each have that in turn shows them side by side instead. Every value comes from window.MV. -->
<template>
  <style>
    #root { position: absolute; inset: 0; background: var(--ground); container-type: size; overflow: hidden; }
    #rf-src { position: absolute; left: 8cqw; right: 8cqw; top: 6cqh; font-family: var(--font-mono); font-size: 2.3cqh; color: var(--muted); }
    .rf-item { position: absolute; left: 8cqw; right: 8cqw; top: 16cqh; bottom: 26cqh; display: flex; flex-direction: column; justify-content: center; gap: 1.6cqh; transform-origin: 0% 50%; }
    .rf-label { font-family: var(--font-text); font-weight: 700; font-size: 4.4cqh; color: var(--ink); }
    .rf-num { font-family: var(--font-display); font-size: 28cqh; line-height: 0.9; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rf-count { font-family: var(--font-text); font-size: 4.2cqh; color: var(--ink); }
    .rf-count i { font-style: normal; display: inline-block; width: 1.6cqw; height: 1.6cqw; margin-right: 1cqw; background: var(--accent); vertical-align: middle; }
    .rf-none { font-family: var(--font-display); font-size: 17cqh; line-height: 0.95; color: var(--ink); text-transform: uppercase; }
    .rf-cols { flex-direction: row; justify-content: flex-start; align-items: center; gap: 3cqw; }
    .rf-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 1.6cqh; }
    .rf-cols .rf-label { font-size: 3.4cqh; }
    .rf-cols .rf-count { font-size: 3.4cqh; }
  </style>
  <div id="root" data-composition-id="refunds" data-width="1920" data-height="1080">
    <div id="rf-span" class="clip" data-start="0" data-duration="8" data-mv-span>
      <div id="rf-src"></div>
      <div id="rf-stage"></div>
    </div>
  </div>
  <script>
    const mv = window.MV;
    const list = mvFilmed();
    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
    document.getElementById("rf-src").textContent = mv.source_line;
    // Each currency's items, in order: refunds, disputes, then money won back from disputes, each only when there was some.
    const items = list.map((c) => {
      const out = [];
      if (c.refunds.count) out.push({ label: `Refunds · ${c.code.toUpperCase()}`, money: c.refunds, count: plural(c.refunds.count, "refund", "refunds") });
      if (c.disputes.count) out.push({ label: `Disputes · ${c.code.toUpperCase()}`, money: c.disputes, count: plural(c.disputes.count, "dispute", "disputes") });
      if (c.dispute_reversals.count) out.push({ label: `Won back from disputes · ${c.code.toUpperCase()}`, money: c.dispute_reversals, count: `${plural(c.dispute_reversals.count, "dispute", "disputes")} won` });
      return out;
    });
    // A currency's figures in turn when each gets item_seconds, else side by side for the whole of its part.
    const seg = mvSeg("refunds");
    const together = items.map((its) => its.length > 1 && seg / its.length < mv.plan.item_seconds);
    const parts = items.map((its, s) => (together[s] ? 1 : Math.max(1, its.length)));
    const figure = (it, s, k) => `<div class="rf-label">${esc(it.label)}</div><div class="rf-num" id="rf-num-${s}-${k}"></div><div class="rf-count"><i></i>${esc(it.count)}</div>`;
    document.getElementById("rf-stage").innerHTML = list.map((c, s) => {
      if (!items[s].length) return `<div class="rf-item" id="rf-${s}-0"><div class="rf-label">${c.code.toUpperCase()}</div><div class="rf-none">No refunds or disputes</div></div>`;
      if (together[s]) return `<div class="rf-item rf-cols" id="rf-${s}-0">${items[s].map((it, k) => `<div class="rf-col">${figure(it, s, k)}</div>`).join("")}</div>`;
      return items[s].map((it, k) => `<div class="rf-item" id="rf-${s}-${k}">${figure(it, s, k)}</div>`).join("");
    }).join("");
    rfReady(["rf-src"]).then(() => {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#rf-src", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.1);
      list.forEach((c, s) => {
        const part = seg / parts[s];
        for (let k = 0; k < parts[s]; k++) {
          const t0 = s * seg + k * part;
          const id = `#rf-${s}-${k}`;
          tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, t0);
          tl.fromTo(id, { scale: 1 }, { scale: 1.03, duration: part, ease: "none" }, t0);
          // The figures this part shows: one in turn, or every one of the currency's side by side.
          const shown = together[s] ? items[s].map((it, j) => j) : items[s].length ? [k] : [];
          const width = (together[s] ? 0.84 / items[s].length - 0.03 : 0.84) * innerWidth;
          for (const j of shown) {
            const el = document.getElementById(`rf-num-${s}-${j}`);
            el.textContent = items[s][j].money.display;
            rfFit(el, { w: width, max: (together[s] ? 0.2 : 0.3) * innerHeight });
            mvCount(tl, el, items[s][j].money, c.symbol, t0 + 0.25);
          }
          if (shown.length) tl.fromTo(`${id} .rf-count`, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, t0 + 1.5);
          const last = s === list.length - 1 && k === parts[s] - 1;
          if (!last) tl.to(id, { opacity: 0, duration: 0.18, ease: "power3.in" }, t0 + part - 0.2);
        }
      });
      window.__timelines["refunds"] = tl;
    });
  </script>
</template>
