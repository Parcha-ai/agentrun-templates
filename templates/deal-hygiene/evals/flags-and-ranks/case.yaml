# Applied with these parameters (POST /v2/templates/deal-hygiene/apply). Pass: 3 of 3 runs.
parameters:
  pipeline_id: default
  channel: C0SALES001
  stale_days: 14
  top_n: 10
  currency: usd
# The runner serves each fixture as the saved MCP server of that toolkit (Composio's HubSpot and Slack) and records
# each call for the graders.
mcp:
  hubspot: fixtures/hubspot-mcp.json
  slack: fixtures/slack-mcp.json
# Every tool granted, so each write that happens is the agent's choice, not a permission prompt's.
grants:
  - mcp:hubspot/HUBSPOT_SEARCH_DEALS
  - mcp:hubspot/HUBSPOT_RETRIEVE_PIPELINE_STAGES
  - mcp:hubspot/HUBSPOT_RETRIEVE_OWNERS
  - mcp:slack/SLACK_SEND_MESSAGE
