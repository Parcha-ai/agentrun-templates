# Applied with these parameters (POST /v2/templates/release-shipped/apply). Pass: 3 of 3 runs.
parameters:
  owner: acme
  repo: lantern
  channel: C0SHIPIT1
# A fake of acme/lantern's releases.atom on loopback: the trigger's first poll reads the feed's items, then its next
# poll fires on the fixture's item.
feed: fixtures/feed.json
# The runner serves each fixture as the saved MCP server for its toolkit (GitHub's MCP on a token, Composio's Slack)
# and records each call for the graders.
mcp:
  github: fixtures/github-mcp.json
  slack: fixtures/slack-mcp.json
# Every tool granted, so each post that happens is the agent's choice, not a permission prompt's.
grants:
  - mcp:github/get_release_by_tag
  - mcp:github/list_releases
  - mcp:github/list_pull_requests
  - mcp:github/pull_request_read
  - mcp:slack/SLACK_SEND_MESSAGE
# The agent starts with the releases already announced as a learned note (MEMORY.md and its note).
learning: fixtures/learning
now: 2026-11-14T16:00:00Z
