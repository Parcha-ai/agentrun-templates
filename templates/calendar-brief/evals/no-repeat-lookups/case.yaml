# Applied with these parameters. Pass: 3 of 3 runs. The fixtures stand in for the owner's Composio Google Calendar and
# Slack; every call is recorded for the graders. The web is not reachable: the prompt holds what the URLs return.
parameters:
  channel: C0BRIEF001
  days: 2
# The calendar fixture is for 2026-11-17 and 18: the run fires at the schedule's 07:00 on the 17th.
now: 2026-11-17T07:00:00Z
mcp:
  googlecalendar: fixtures/calendar-mcp.json
  slack: fixtures/slack-mcp.json
grants:
  - mcp:googlecalendar/GOOGLECALENDAR_EVENTS_LIST
  - mcp:slack/SLACK_SEND_MESSAGE
# The prompt ends with the last run's answer, the way the runtime hands a scheduled run its history.
