# complete on the first grouped read: the voiceover 23.77 s with character timestamps of a stand-in take, the music
# 30 s). web.json fakes GitHub's API for acme/quarry's v3.2.0 release, its two screenshots, the owner's avatar and
# fal's CDN files (real mp3 and png bytes). The film is built and rendered for real in the run's sandbox. Pass: 2 of 2.
