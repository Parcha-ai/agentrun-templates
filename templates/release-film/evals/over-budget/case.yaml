# Applied with these parameters. The runner serves fixtures/fal-mcp.json as the saved URL server fal: it prices both
# endpoints, and every job would complete, but max_fal_usd 0.10 is below any plan (about $0.38). web.json fakes
# GitHub's API for acme/quarry's v3.2.0 release, its screenshots and the avatar. Pass: 2 of 2.
parameters:
  owner: acme
  repo: quarry
mcp:
  fal: fixtures/fal-mcp.json
web: fixtures/web.json
# Every fal tool granted, so each paid call is the agent's choice, not a permission prompt's.
grants:
  - mcp:fal/get_pricing
  - mcp:fal/get_model_schema
  - mcp:fal/submit_job
  - mcp:fal/wait_for_jobs
  - mcp:fal/get_submission
now: 2026-11-22T12:00:00Z
