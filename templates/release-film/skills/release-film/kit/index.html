<!doctype html>
<!--
  Release film kit: a working HyperFrames project, 30 s at 1920x1080, that renders as it is. Copy the whole kit
  folder, then change the copy: the palette below, each scene's words and timings, the scene hosts' slots.
  Scenes are back to back on lane 1; captions sit over them on lane 2; voice and music are lanes 3 and 4.
  Every scene sizes itself in container units (cqw, cqh, cqmin) of its own root, so another aspect is only the
  data-width and data-height of every root and host (sed them together; SKILL.md says how).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        /* The palette: take it from the release's own images or the brand's mark when there are any. */
        --night: #101014;
        --paper: #f1eee6;
        --ink: #111114;
        --accent: #d7ff3a;
        --accent-ink: #111114;
        --alert: #ff4d3d;
        --field: #2733ff;
        --field-ink: #ffffff;
        --font-display: "League Gothic";
        --font-text: "Inter";
        --font-mono: "JetBrains Mono";
        /* Captions read on any scene: light words on a dark scrim sized to the text. */
        --cap-font: "Inter";
        --cap-ink: #ffffff;
        --cap-bg: rgba(12, 12, 14, 0.86);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--night); }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html" data-start="4.5" data-duration="3.1" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="proof-a" data-composition-id="proof-a" data-composition-src="compositions/proof-a.html" data-start="7.6" data-duration="5.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="proof-b" data-composition-id="proof-b" data-composition-src="compositions/proof-b.html" data-start="13.2" data-duration="5.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="payoff" data-composition-id="payoff" data-composition-src="compositions/payoff.html" data-start="18.4" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="24.4" data-duration="5.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="30" data-track-index="2" data-track-kind="captions" data-width="1920" data-height="1080"></div>
      <audio id="voiceover" class="clip" src="assets/voiceover.mp3" data-start="0.5" data-track-index="3" data-volume="1"></audio>
      <audio id="music" class="clip" src="assets/music.mp3" data-start="0" data-duration="30" data-track-index="4" data-volume="0.16" data-fade-in="0.4" data-fade-out="1.5"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
