<!doctype html>
<!-- Share card: one still, 1200x630, that holds up on its own in a feed: the version as the biggest thing on it, one
     line (the payoff, at most 8 words), the mark and the name. From the film's own palette, faces and words. Render
     it with `hyperframes snapshot card --at 0.5 --no-end -o <dir>`; the still is the PNG it writes. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --paper: #f1eee6; --ink: #111114; --accent: #d7ff3a; --accent-ink: #111114;
        --font-display: "League Gothic"; --font-text: "Inter"; --font-mono: "JetBrains Mono"; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--accent); }
      #root { position: relative; width: 100%; height: 100%; container-type: size; }
      #card-ground { position: absolute; inset: 0; background: var(--accent); }
      /* The version: as wide as the card allows. A long tag (v0.1.0-beta.51) takes 30cqh; a short one (v3.2) can
         go to 44cqh. One line, never wrapped. */
      #card-ver { position: absolute; left: 5.5cqw; top: 6cqh; white-space: nowrap; font-family: var(--font-display);
        font-size: 34cqh; line-height: 0.92; letter-spacing: -0.005em; color: var(--accent-ink); }
      #card-head { position: absolute; left: 6cqw; right: 6cqw; top: 46cqh; font-family: var(--font-text); font-weight: 900;
        font-size: 9cqh; line-height: 1.04; letter-spacing: -0.03em; color: var(--accent-ink); }
      #card-foot { position: absolute; left: 6cqw; right: 6cqw; bottom: 8cqh; display: flex; align-items: center; gap: 2.4cqh;
        padding-top: 3cqh; border-top: 0.6cqh solid var(--accent-ink); }
      #card-mark { width: 11cqh; height: 11cqh; object-fit: cover; }
      #card-name { font-family: var(--font-text); font-weight: 900; font-size: 6.4cqh; letter-spacing: -0.03em; color: var(--accent-ink); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1200" data-height="630">
      <div id="card-ground" class="clip" data-start="0" data-duration="1"></div>
      <div id="card-ver" class="clip" data-start="0" data-duration="1">KIT v2.4.0</div>
      <div id="card-head" class="clip" data-start="0" data-duration="1">KIT the one thing this release does</div>
      <div id="card-foot" class="clip" data-start="0" data-duration="1">
        <img id="card-mark" src="assets/mark.png" alt="" />
        <div id="card-name">KIT name</div>
      </div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
