<!doctype html>
<!-- Share card: one still, 1200x630, from the film's own palette, faces and words. Render it with
     `hyperframes snapshot card --at 0.5 --no-end -o <dir>`; the still is the PNG it writes. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --paper: #f1eee6; --ink: #111114; --accent: #d7ff3a; --accent-ink: #111114;
        --font-display: "League Gothic"; --font-text: "Inter"; --font-mono: "JetBrains Mono"; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--accent); }
      #root { position: relative; width: 100%; height: 100%; container-type: size; }
      #card-ground { position: absolute; inset: 0; background: var(--accent); }
      #card-head { position: absolute; left: 6cqw; right: 6cqw; top: 14cqh; font-family: var(--font-display);
        font-size: 15cqh; line-height: 0.95; color: var(--accent-ink); text-transform: uppercase; }
      #card-foot { position: absolute; left: 6cqw; right: 6cqw; bottom: 9cqh; display: flex; align-items: center; gap: 2.4cqh; }
      #card-mark { width: 13cqh; height: 13cqh; object-fit: cover; }
      #card-name { font-family: var(--font-text); font-weight: 900; font-size: 7cqh; letter-spacing: -0.03em; color: var(--accent-ink); }
      #card-ver { margin-left: auto; padding: 1.2cqh 2.2cqh; background: var(--ink); color: var(--paper);
        font-family: var(--font-mono); font-weight: 700; font-size: 4.4cqh; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1200" data-height="630">
      <div id="card-ground" class="clip" data-start="0" data-duration="1"></div>
      <div id="card-head" class="clip" data-start="0" data-duration="1">KIT the one thing this release does</div>
      <div id="card-foot" class="clip" data-start="0" data-duration="1">
        <img id="card-mark" src="assets/mark.png" alt="" />
        <div id="card-name">KIT name</div>
        <div id="card-ver">KIT v2.4.0</div>
      </div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
