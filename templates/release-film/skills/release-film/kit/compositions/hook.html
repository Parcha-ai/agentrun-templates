<!-- Hook (about 8-14%): the old way failing, in the release's own words (an error string, a slow number, a
     complaint from an issue). The label is on screen at frame 0 (the thumbnail); the mono words blur in one by
     one, hold, then a strike wipes through them. -->
<template>
  <style>
    #root { position: absolute; inset: 0; background: var(--night); container-type: size; overflow: hidden; }
    #hook-label { position: absolute; left: 9cqw; top: 26cqh; font-family: var(--font-mono); font-weight: 700;
      font-size: 2.6cqmin; letter-spacing: 0.12em; text-transform: uppercase; color: var(--alert); }
    #hook-line { position: absolute; left: 9cqw; right: 9cqw; top: 34cqh; font-family: var(--font-mono); font-weight: 700;
      font-size: 6.4cqmin; line-height: 1.12; color: var(--paper); }
    #hook-strike { position: absolute; left: 9cqw; top: 47cqh; width: 78cqw; height: 1.1cqmin; background: var(--alert);
      transform-origin: left center; }
    .hw { display: inline-block; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <div id="hook-label" class="clip" data-start="0" data-duration="4.2">KIT · what used to go wrong</div>
    <div id="hook-line" class="clip" data-start="0.3" data-duration="3.9"><span class="hw">"KIT</span> <span class="hw">error</span> <span class="hw">string</span> <span class="hw">here"</span></div>
    <div id="hook-strike" class="clip" data-start="2.4" data-duration="1.8"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#hook-line .hw", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.09, ease: "power4.out" }, 0.3);
    tl.fromTo("#hook-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 2.4);
    tl.to("#hook-line", { opacity: 0.35, duration: 0.25, ease: "power2.out" }, 2.5);
    window.__timelines["hook"] = tl;
  </script>
</template>
