<!-- Hook (about 12-15%): the old way failing, in the release's own words (the error message it fixes, the step it
     removes, the complaint from the issue it closes), full frame on the alert ground. Frame 0 already shows the
     context line and the first word (it is the thumbnail). The words slam in one by one, hold long enough to read,
     then a bar strikes through each word and the frame jolts before the cut. Keep the line to 3-8 words; a longer error
     is cut to its telling part, never shrunk. -->
<template>
  <style>
    #root { position: absolute; inset: 0; background: var(--alert); container-type: size; overflow: hidden; }
    #hook-all { position: absolute; inset: 0; }
    #hook-label { position: absolute; left: 8cqw; right: 8cqw; top: 14cqh; font-family: var(--font-text); font-weight: 900;
      font-size: 5.4cqmin; letter-spacing: -0.02em; line-height: 1.1; color: var(--ink); }
    #hook-line { position: absolute; left: 8cqw; right: 8cqw; top: 30cqh; font-family: var(--font-mono); font-weight: 700;
      font-size: 11cqmin; line-height: 1.06; letter-spacing: -0.04em; color: var(--ink); overflow-wrap: break-word; }
    .hs { position: absolute; left: -0.06em; right: -0.06em; top: 50%; height: 0.12em; background: var(--ink);
      transform-origin: left center; }
    .hw { display: inline-block; position: relative; }
    /* Square (1:1): the same words in a narrower frame. */
    @container (max-aspect-ratio: 5/4) {
      #hook-line { font-size: 8.4cqw; }
    }
    /* Portrait (9:16): the clear area of every 9:16 platform (TikTok, Reels, Shorts) is 15-65% of the height and
       11-82% of the width (11-72% below 44%): captions and buttons own the rest. */
    @container (max-aspect-ratio: 3/4) {
      #hook-label { left: 12cqw; right: 18cqw; top: 16cqh; font-size: 6cqw; }
      #hook-line { left: 12cqw; right: 18cqw; top: 25cqh; font-size: 7.4cqw; }
    }
  </style>
  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080">
    <div id="hook-all">
      <div id="hook-label" class="clip" data-start="0" data-duration="4.5">KIT what used to happen</div>
      <div id="hook-line" class="clip" data-start="0" data-duration="4.5"><span class="hw">"KIT</span> <span class="hw">error</span> <span class="hw">string</span> <span class="hw">here"</span></div>
    </div>
  </div>
  <script>
    // One strike bar inside each word, so the strike crosses every word wherever the line wraps (untimed, made
    // once before the timeline is built).
    document.querySelectorAll("#hook-line .hw").forEach((w) => { const bar = document.createElement("i"); bar.className = "hs"; w.appendChild(bar); });
    const tl = gsap.timeline({ paused: true });
    // The first word is already there at 0; the rest slam in 0.11 s apart.
    tl.fromTo("#hook-line .hw:not(:first-child)", { opacity: 0, scale: 1.35, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.16, stagger: 0.11, ease: "expo.out" }, 0.25);
    tl.fromTo("#hook-line .hs", { scaleX: 0 }, { scaleX: 1, duration: 0.14, stagger: 0.06, ease: "expo.out" }, 2.9);
    tl.to("#hook-line .hw", { opacity: 0.4, duration: 0.2, ease: "power2.out" }, 3.0);
    // The jolt: three hard frames of offset before the cut, deterministic.
    tl.set("#hook-all", { x: -14 }, 4.2);
    tl.set("#hook-all", { x: 10 }, 4.27);
    tl.set("#hook-all", { x: 0 }, 4.33);
    tl.to("#hook-all", { x: -220, filter: "blur(14px)", duration: 0.13, ease: "power3.in" }, 4.37);
    window.__timelines["hook"] = tl;
  </script>
</template>
