<!-- End card (last 15-20%, at most 6 s): the mark carried in once, with weight, and the name beside it; then the
     version, the biggest type on the card, filling the middle; then the call to action in the release's own words
     (the install command, the upgrade line) typing itself in. The version keeps pushing in for the whole hold, so a
     long hold still moves. The mark is the owner's own image file, never redrawn. Each part of the version is one
     .eseg (v0.1.0- and beta.51 are two), so a long version wraps between parts, never inside one. -->
<template>
  <style>
    #root { position: absolute; inset: 0; background: var(--paper); container-type: size; overflow: hidden; }
    #ec-flood { position: absolute; inset: 0; background: var(--accent); }
    /* One column: the lockup, the version, the command. A version that wraps pushes the command down. */
    #ec-stack { position: absolute; left: 6cqw; right: 6cqw; top: 0; bottom: 8cqh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3cqh; }
    #ec-lock { display: flex; align-items: center; justify-content: center; gap: 2.4cqmin; }
    #ec-markwrap { width: 11cqmin; height: 11cqmin; }
    #ec-mark { width: 100%; height: 100%; object-fit: cover; }
    #ec-name { font-family: var(--font-text); font-weight: 900; font-size: 7.4cqmin; letter-spacing: -0.04em; color: var(--accent-ink); }
    #ec-ver { text-align: center; font-family: var(--font-display); font-size: 36cqmin; line-height: 0.92;
      color: var(--accent-ink); transform-origin: 50% 50%; }
    .eseg { display: inline-block; white-space: nowrap; }
    #ec-cmd { display: inline-block; padding: 1.4cqmin 2.6cqmin; background: var(--ink); color: var(--paper);
      font-family: var(--font-mono); font-weight: 700; font-size: 4cqmin; }
    /* Portrait (9:16): the clear area of every 9:16 platform (TikTok, Reels, Shorts) is 15-65% of the height and
       11-82% of the width (11-72% below 44%): captions and buttons own the rest. */
    @container (max-aspect-ratio: 3/4) {
      #ec-stack { left: 12cqw; right: 29cqw; top: 17cqh; bottom: auto; align-items: flex-start; justify-content: flex-start; gap: 2.2cqh; }
      #ec-lock { justify-content: flex-start; }
      #ec-markwrap { width: 12cqw; height: 12cqw; }
      #ec-name { font-size: 8.6cqw; }
      #ec-ver { text-align: left; font-size: 19cqw; line-height: 1; transform-origin: 0% 50%; }
      #ec-cmd { font-size: 3.6cqw; }
    }
  </style>
  <div id="root" data-composition-id="endcard" data-width="1920" data-height="1080">
    <div id="ec-flood" class="clip" data-start="0" data-duration="5.6"></div>
    <div id="ec-stack">
      <div id="ec-lock">
        <div id="ec-markwrap"><img id="ec-mark" class="clip" src="assets/mark.png" alt="" data-start="0.3" data-duration="5.3" /></div>
        <div id="ec-name" class="clip" data-start="0.6" data-duration="5">KIT name</div>
      </div>
      <div id="ec-ver" class="clip" data-start="0.9" data-duration="4.7"><span class="eseg">KIT2.4.0</span></div>
      <div id="ec-cta" class="clip" data-start="1.6" data-duration="4"><span id="ec-cmd">KIT the command to run</span></div>
    </div>
  </div>
  <script>
    // A 9:16 frame pushes less: its clear area is narrow, and the words stay inside it as they grow.
    const tall = window.innerHeight > window.innerWidth;
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#ec-flood", { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.4, ease: "power2.inOut" }, 0);
    tl.fromTo("#ec-markwrap", { scale: 0.55, rotation: -10, filter: "blur(10px)" }, { scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.4)" }, 0.3);
    tl.fromTo("#ec-name", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "power3.out" }, 0.6);
    // The version lands hard, then keeps coming at the viewer until the cut.
    tl.fromTo("#ec-ver", { opacity: 0, scale: 1.25, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 0.9);
    tl.fromTo("#ec-ver", { scale: 1 }, { scale: tall ? 1.03 : 1.07, duration: 4.35, ease: "none", immediateRender: false }, 1.25);
    tl.fromTo("#ec-cmd", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 1.6);
    // The command types itself in the box, which is already its own size.
    tl.fromTo("#ec-cmd", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "steps(28)" }, 1.6);
    window.__timelines["endcard"] = tl;
  </script>
</template>
