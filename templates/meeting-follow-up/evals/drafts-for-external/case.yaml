# Applied with these parameters. Pass: 3 of 3 runs. The fixtures stand in for the owner's Composio Google Calendar and
# Gmail; every call is recorded for the graders.
parameters:
  internal_domains: [acme.example]
mcp:
  googlecalendar: fixtures/calendar-mcp.json
  gmail: fixtures/gmail-mcp.json
# Both tools granted, as the owner ticks the draft at apply, so the drafts that happen are the agent's choice.
grants:
  - mcp:googlecalendar/GOOGLECALENDAR_EVENTS_LIST
  - mcp:gmail/GMAIL_CREATE_EMAIL_DRAFT
