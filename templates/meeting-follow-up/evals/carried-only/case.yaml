# Applied with these parameters. The fixtures stand in for the owner's Composio Google Calendar and Gmail; every call is
# recorded for the graders.
parameters:
  internal_domains: [acme.example]
  cron: "0 9,12,15,17 * * 1-5"
mcp:
  googlecalendar: fixtures/calendar-mcp.json
  gmail: fixtures/gmail-mcp.json
grants:
  - mcp:googlecalendar/GOOGLECALENDAR_EVENTS_LIST
  - mcp:gmail/GMAIL_CREATE_EMAIL_DRAFT
# The prompt ends with what agentrun hands this run from fixtures/last-run.json (.github/handed-history.mjs): the last
# answer is over 32 KiB, so its carried fields alone, nothing dropped.
now: 2026-11-17T17:00:00Z
