# Checks that every template's eval cases still parse under the latest released AgentRun server, the way
# `agentrun-serve eval-template` reads them before its first run. Nothing runs: no model, no key, no spend.
# A release can refuse a case field (beta.45 made a case's `learning` one corrections file); the daily run
# catches that before a user's first eval does, even with no push here.
name: evals-parse

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGENTRUN_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.3
      # No `# Learned` string and no "What you remember" heading in any template: the runtime names the owner's
      # corrections itself, and a run's state travels only as its run history.
      - run: node .github/lint-templates.mjs
      # A rubric that quotes a fixture word for word (a release's notes) holds the fixture's exact text.
      - run: node .github/lint-rubric-quotes.mjs
      # A scheduled run's last answer is handed whole under 32 KiB, else its `x-carried` fields alone, the oldest entries
      # of its carried arrays dropped to fit: every carried field must be bounded, and the ones never cut fit 12,000 bytes.
      - run: node --test .github/lint-handoff-size.test.mjs
      - run: node .github/lint-handoff-size.mjs
      # The music video kit's place step, on synthetic media with the sandbox's tools (ffmpeg, ffprobe), no model: the
      # join of the clips into one video runs one ffmpeg at a time, its memory stays flat from 6 shots to 12, and the
      # joined video tiles the cut frame for frame (HyperFrames extracting six clips at once ran a 4 GiB sandbox out of
      # memory).
      - run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg)
      - run: node --test .github/music-video-kit.test.mjs
      # The metrics film kit, node only, on synthetic Stripe pages: a currency the last result could not carry (a week of
      # more than ten) is never said to be restated, and money won back from an earlier week's dispute is on the film.
      - run: node --test .github/metrics-video-kit.test.mjs
      # The explainer's caption kit, node only, on two recorded ElevenLabs takes and synthetic scripts: every cue is one
      # or two lines of at most 42 characters, timed in code (aligned to fal's letters, anchored, or measured), and a
      # voice with no timestamps and no length exits 2.
      - run: node --test .github/explainer-captions.test.mjs
      # The news show kit's answer script, on synthetic answers and media: the cost is worked out in code and its total is
      # the sum of the rounded steps; the check fails a typed total, a summary report, a report that is not media/report.md
      # byte for byte, a missing section or story link, and an error not quoted; R1's added rubric fact
      # is a substring of the fixture's page.
      - run: node --test .github/news-show-answer-kit.test.mjs
      # `latest` is the dist-tag every AgentRun release is published under.
      - run: npm install --prefix "$RUNNER_TEMP/serve" --no-save --no-audit --no-fund --ignore-scripts @parcha/agentrun-serve@latest
      - run: node .github/parse-evals.mjs "$RUNNER_TEMP/serve"
      # ai-search-visibility's robots.txt read rules live in its output schema: checked by serve's own validator.
      - run: node --test .github/visibility-schema.test.mjs
        env:
          AGENTRUN_SERVE_DIR: ${{ runner.temp }}/serve
      # Each template's own cap covers one step and an answer on every harness it lists, on the model it was measured on,
      # as the server warns at save; below that, every run stops at its first tool call (inbox-assistant paused at once).
      - run: node .github/lint-caps.mjs "$RUNNER_TEMP/serve"
