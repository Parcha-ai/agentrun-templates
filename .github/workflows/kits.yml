# Tests a template kit's own scripts against synthetic media, with the tools the sandbox has (ffmpeg, ffprobe).
# No model, no key, no spend. The music video kit's place step joins the clips into one video: one ffmpeg at a time,
# memory flat in the number of shots, the cut tiled frame for frame (a 4 GiB sandbox ran out of memory when HyperFrames
# extracted six clips at once).
name: kits

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  music-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.3
      - run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg)
      - run: ffmpeg -version | head -1
      - run: node --test .github/music-video-kit.test.mjs
