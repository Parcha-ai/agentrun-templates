# Checks that marketplace.agentrun.ai still builds from this commit: tests, a full build and the page checker.
# It deploys nothing: the host builds site/Dockerfile from main on every push and serves it (site/README.md, Deploy).
# A pull request that would break that build fails here first.
name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm test --prefix site
      # The token only raises the API rate limit for the star counts; without it the build goes anonymous.
      - run: node site/build.mjs --sha "${{ github.event.pull_request.head.sha || github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node site/check.mjs
